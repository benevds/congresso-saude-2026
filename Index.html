<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Congresso em Ciências da Saúde na Amazônia - UFOPA</title>
    <style>
        /* Estilos Gerais (Reset e Tipografia) */
        :root {
            --primary: #004d40; /* Verde Amazônia */
            --secondary: #00796b; /* Verde Claro */
            --accent: #ffca28; /* Amarelo Ouro */
            --text: #333;
            --light: #f4f4f4;
            --white: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: var(--text); background-color: var(--light); }
        
        /* Cabeçalho */
        header { background-color: var(--primary); color: var(--white); padding: 1rem 0; text-align: center; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo-text { font-size: 1.2rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Hero Section (Destaque) */
        .hero {
            background: linear-gradient(rgba(0, 77, 64, 0.9), rgba(0, 77, 64, 0.8)), url('https://source.unsplash.com/1600x900/?amazon,river,nature') no-repeat center center/cover;
            color: var(--white);
            padding: 80px 20px;
            text-align: center;
        }
        .hero h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .hero h2 { font-size: 1.2rem; font-weight: 300; margin-bottom: 20px; color: var(--accent); }
        .hero .date-location { font-size: 1.1rem; margin-top: 20px; font-weight: bold; }
        .btn {
            display: inline-block;
            background-color: var(--accent);
            color: var(--primary);
            padding: 12px 30px;
            margin-top: 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn:hover { background-color: #ffb300; }

        /* Seções de Conteúdo */
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        section { margin-bottom: 60px; background: var(--white); padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h3 { color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; display: inline-block; }
        
        /* Listas e Tabelas */
        ul { list-style-position: inside; margin-left: 10px; }
        li { margin-bottom: 8px; }
        .highlight-box { background-color: #e0f2f1; border-left: 5px solid var(--secondary); padding: 15px; margin: 20px 0; }
        
        /* Cronograma Simples */
        .schedule-day { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .schedule-day h4 { color: var(--secondary); margin-bottom: 5px; }
        .schedule-time { font-weight: bold; color: #555; font-size: 0.9rem; }

        /* Rodapé */
        footer { background-color: #263238; color: #cfd8dc; text-align: center; padding: 30px 20px; font-size: 0.9rem; }
        .footer-logos { margin-top: 15px; font-weight: bold; }

        /* Responsivo */
        @media (max-width: 768px) {
            .hero h1 { font-size: 1.8rem; }
